name: Deploy Website to Cloudflare Pages (omnibuf.com)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v5
        with:
          install: true

      - name: Install frontend dependencies
        run: just web-install

      - name: Check formatting & lint
        run: |
          just web-fmt-check
          just web-lint

      - name: Build Astro static site
        run: just web-build

      - name: Deploy to Cloudflare Pages (omnibuf.com)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: web
        run: |
          pnpm exec wrangler pages project list | grep -q "omnibuf" || pnpm exec wrangler pages project create omnibuf --production-branch=main
          pnpm exec wrangler pages deploy ./dist --project-name=omnibuf --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
